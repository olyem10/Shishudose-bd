<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Warm sky/sun glow -->
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bottom Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Syringe barrel gradient -->
    <linearGradient id="syringeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Drop gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Badge Base -->
  <circle cx="256" cy="256" r="248" fill="#ffffff" />
  <circle cx="256" cy="256" r="236" fill="#f8fafc" stroke="url(#ringGrad)" stroke-width="16" />

  <!-- Inner Sun & Sky Atmosphere -->
  <path d="M 40 256 A 216 216 0 0 1 472 256 Z" fill="url(#sunGlow)" />
  <circle cx="220" cy="240" r="160" fill="#fef3c7" opacity="0.6" />

  <!-- Medicine Droplet -->
  <path d="M 305 130 C 295 145 285 160 285 172 A 18 18 0 0 0 321 172 C 321 160 312 145 305 130 Z" fill="url(#dropGrad)" />
  <circle cx="300" cy="168" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Medicine Syringe (Oral Dispenser) -->
  <g transform="translate(325, 115) rotate(42)">
    <!-- Syringe Plunger -->
    <rect x="-6" y="-30" width="12" height="35" rx="3" fill="#cbd5e1" />
    <rect x="-14" y="-35" width="28" height="8" rx="3" fill="#0284c7" />
    <!-- Flange -->
    <rect x="-18" y="0" width="36" height="8" rx="2" fill="#0284c7" />
    <!-- Barrel -->
    <rect x="-12" y="8" width="24" height="60" rx="3" fill="#f8fafc" stroke="#0284c7" stroke-width="3" />
    <!-- Liquid inside -->
    <rect x="-9" y="24" width="18" height="42" fill="url(#syringeGrad)" rx="2" />
    <!-- Tip / Nozzle -->
    <rect x="-4" y="68" width="8" height="18" fill="#0284c7" rx="2" />
    <line x1="-3" y1="20" x2="3" y2="20" stroke="#0284c7" stroke-width="2" />
    <line x1="-3" y1="35" x2="3" y2="35" stroke="#0284c7" stroke-width="2" />
    <line x1="-3" y1="50" x2="3" y2="50" stroke="#0284c7" stroke-width="2" />
  </g>

  <!-- Green Herbal Leaf -->
  <path d="M 425 160 C 445 250 410 320 310 340 C 370 290 410 240 425 160 Z" fill="url(#leafGrad)" />
  <path d="M 425 160 C 390 230 350 280 310 340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- Cute Baby Illustration -->
  <g filter="url(#shadow)">
    <!-- Baby Body / Clothes (Light Blue & Green Stripes) -->
    <!-- Legs / Onesie Bottom -->
    <path d="M 160 300 C 150 330 170 355 220 355 C 270 355 300 335 305 305 C 310 270 270 250 230 250 C 190 250 170 270 160 300 Z" fill="#93c5fd" />
    <!-- Stripes -->
    <path d="M 165 315 Q 230 340 295 315" stroke="#4ade80" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 175 285 Q 230 310 285 285" stroke="#4ade80" stroke-width="9" stroke-linecap="round" fill="none" />

    <!-- Left Foot -->
    <ellipse cx="275" cy="335" rx="22" ry="15" fill="#60a5fa" transform="rotate(-10 275 335)" />
    <!-- Right Foot -->
    <ellipse cx="205" cy="340" rx="22" ry="14" fill="#60a5fa" transform="rotate(5 205 340)" />

    <!-- Left Arm reaching towards syringe -->
    <path d="M 245 250 C 270 240 290 215 305 210 C 312 208 318 215 315 222 C 305 235 285 260 260 270 Z" fill="#93c5fd" />
    <!-- Hand -->
    <circle cx="312" cy="212" r="11" fill="#fed7aa" />
    <circle cx="318" cy="208" r="4" fill="#fed7aa" />

    <!-- Right Arm -->
    <path d="M 180 260 C 160 270 160 290 175 300 C 185 305 200 295 195 280 Z" fill="#93c5fd" />
    <circle cx="165" cy="290" r="10" fill="#fed7aa" />

    <!-- Baby Head -->
    <circle cx="225" cy="180" r="54" fill="#fed7aa" />
    <!-- Cheeks (Blushing pink) -->
    <circle cx="195" cy="195" r="12" fill="#fca5a5" opacity="0.65" />
    <circle cx="255" cy="195" r="12" fill="#fca5a5" opacity="0.65" />

    <!-- Soft Hair Tufts -->
    <path d="M 215 128 C 225 118 240 120 248 132 C 240 128 230 130 225 136 C 220 126 210 130 205 135 C 210 130 212 128 215 128 Z" fill="#b45309" />
    <path d="M 185 145 C 190 135 205 138 210 148 C 200 144 192 146 185 145 Z" fill="#b45309" />

    <!-- Big Happy Eyes -->
    <ellipse cx="205" cy="175" rx="6" ry="8" fill="#1e293b" />
    <circle cx="207" cy="173" r="2.5" fill="#ffffff" />
    <ellipse cx="245" cy="175" rx="6" ry="8" fill="#1e293b" />
    <circle cx="247" cy="173" r="2.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 198 162 Q 206 158 214 163" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 236 163 Q 244 158 252 162" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Cute Smiling Mouth -->
    <path d="M 214 196 Q 225 212 236 196" stroke="#991b1b" stroke-width="3" fill="#ef4444" stroke-linecap="round" />
    <!-- Nose -->
    <circle cx="225" cy="186" r="2.5" fill="#f97316" opacity="0.6" />
  </g>

  <!-- Bottom Circular Gradient Banner for Title -->
  <path d="M 40 330 C 90 320 170 315 256 315 C 342 315 422 320 472 330 A 236 236 0 0 1 40 330 Z" fill="url(#bannerGrad)" />

  <!-- Bengali Typography: শিশু ডোজ -->
  <text x="256" y="405" font-family="'Plus Jakarta Sans', 'SolaimanLipi', 'SutonnyMJ', Arial, sans-serif" font-size="58" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    শিশু ডোজ
  </text>
  
  <!-- Sub-label: অ্যাপ -->
  <text x="256" y="455" font-family="'Plus Jakarta Sans', 'SolaimanLipi', Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    অ্যাপ
  </text>
</svg>
